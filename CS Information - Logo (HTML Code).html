<meta charset="UTF-8">
<title>CS Information Logo</title>
<style>
  body{
    margin:0; padding:40px;
    background:#0a0a10;
    display:flex; align-items:center; justify-content:center;
  }

  /* ===== CS INFORMATION LOGO BADGE ===== */
  .logo-wrap{
    position:relative;
    width:120px;   /* change size here */
    height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .logo-ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:conic-gradient(from 200deg, #f0c14b, #33e0e8 35%, #9b5cf6 65%, #f0c14b 100%);
    animation:spin 8s linear infinite;
  }
  .logo-ring::after{
    content:"";
    position:absolute;
    inset:5px;              /* ring thickness */
    border-radius:50%;
    background:#0a0a10;     /* match your page background */
  }
  .logo-img{
    position:relative;
    width:86%;
    height:86%;
    border-radius:50%;
    object-fit:cover;
    z-index:2;
    box-shadow:0 0 20px rgba(240,193,75,0.45);
  }
  @keyframes spin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }
  /* If you don't want the ring rotating, just delete the animation line above */
</style>
